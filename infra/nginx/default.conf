# Fungsi file: Mengatur reverse proxy Nginx untuk routing UI, API, dan kebijakan keamanan trafik.
# Nginx reverse proxy untuk Cashflowpoly Analytics Platform
# =========================================================
# UI  -> http://cashflowpoly-ui:5203
# API -> http://cashflowpoly-api:5041

# ---------- Rate limiting zone ----------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Pertahankan skema HTTPS dari reverse proxy/tunnel tepercaya agar aplikasi dapat
# menerapkan redirect dan cookie Secure walaupun hop internal menuju Nginx memakai HTTP.
map $http_x_forwarded_proto $effective_forwarded_proto {
    default $scheme;
    ~*^https$ https;
}

server {
    # Cloudflare Tunnel's managed ingress targets nginx:80. Keep the hardened
    # host-facing port 8080 while also accepting that internal origin port.
    listen 80;
    listen 8080;
    server_name _;

    # Docker DNS resolver to avoid stale upstream IP when api/ui container restart.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $api_upstream http://api:5041;
    set $ui_upstream http://ui:5203;

    error_page 503 @maintenance;
    if (-f /var/www/maintenance/enabled) {
        return 503;
    }

    location @maintenance {
        root /var/www/maintenance;
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ---- Health check endpoint (untuk Docker healthcheck) ----
    location = /health {
        access_log off;
        proxy_pass $ui_upstream/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host ui;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Metrics hanya tersedia di jaringan internal container.
    location = /metrics {
        access_log off;
        return 404;
    }

    # ---- API routes ---- 
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        proxy_set_header X-Client-Request-Id $request_id;

        # Timeout
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Buffer
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # ---- Auth routes (stricter rate limit) ----
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
    }

    # ---- API Landing Page ----
    location = /api {
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
    }
    location = /api/ {
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
    }

    # ---- API static assets (images, favicon) ----
    location /images/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- API landing static assets (avoid clash with UI /images/*) ----
    location ^~ /api-assets/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Health endpoints API ----
    location ~ ^/health/(live|ready)$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- UI (default / fallback) ----
    location / {
        proxy_pass $ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---- Static assets caching ----
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        proxy_pass $ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
        access_log off;
    }
}
