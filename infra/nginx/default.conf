# Fungsi file: Mengatur reverse proxy Nginx untuk routing UI, API, dan kebijakan keamanan trafik.
# Nginx reverse proxy untuk Cashflowpoly Analytics Platform
# =========================================================
# UI  -> http://cashflowpoly-ui:5203
# API -> http://cashflowpoly-api:5041

# ---------- Rate limiting zone ----------
# Penjelasan: Membuat zona pembatas laju berdasarkan alamat IP biner klien; nama zona, kapasitas memori, dan rate menentukan batas request rata-rata untuk trafik API atau login. Deklarasi: limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# Penjelasan: Membuat zona pembatas laju berdasarkan alamat IP biner klien; nama zona, kapasitas memori, dan rate menentukan batas request rata-rata untuk trafik API atau login. Deklarasi: limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Pertahankan skema HTTPS dari reverse proxy/tunnel tepercaya agar aplikasi dapat
# menerapkan redirect dan cookie Secure walaupun hop internal menuju Nginx memakai HTTP.
# Penjelasan: Memetakan header X-Forwarded-Proto ke effective_forwarded_proto agar skema HTTPS publik dapat diteruskan walau koneksi internal memakai HTTP. Deklarasi: map $http_x_forwarded_proto $effective_forwarded_proto {
map $http_x_forwarded_proto $effective_forwarded_proto {
    # Penjelasan: Menetapkan nilai fallback map menjadi skema koneksi aktual ketika header tidak cocok dengan aturan HTTPS. Deklarasi: default $scheme;
    default $scheme;
    # Penjelasan: Menerima teks https tanpa membedakan kapital sebagai skema hasil map; pencocokan dibatasi seluruh nilai header. Deklarasi: ~*^https$ https;
    ~*^https$ https;
# Penjelasan: Menutup blok map, server, location, atau cabang; direktif sesudahnya kembali pada konteks konfigurasi induk. Deklarasi: }
}

# Penjelasan: Membuka konfigurasi virtual server reverse proxy dan aturan lokasi yang akan melayani port listen. Deklarasi: server {
server {
    # Cloudflare Tunnel's managed ingress targets nginx:80. Keep the hardened
    # host-facing port 8080 while also accepting that internal origin port.
    # Penjelasan: Membuka port HTTP internal Nginx yang disebut. Port 80 mendukung origin tunnel, sedangkan 8080 mendukung pemetaan port host/health check. Deklarasi: listen 80;
    listen 80;
    # Penjelasan: Membuka port HTTP internal Nginx yang disebut. Port 80 mendukung origin tunnel, sedangkan 8080 mendukung pemetaan port host/health check. Deklarasi: listen 8080;
    listen 8080;
    # Penjelasan: Menetapkan nama server wildcard konvensional _ pada blok server bawaan ini. Deklarasi: server_name _;
    server_name _;

    # Docker DNS resolver to avoid stale upstream IP when api/ui container restart.
    # Penjelasan: Menggunakan DNS internal Docker 127.0.0.11 dengan cache 10 detik dan IPv6 nonaktif agar alamat API/UI dapat diperbarui setelah container diganti. Deklarasi: resolver 127.0.0.11 ipv6=off valid=10s;
    resolver 127.0.0.11 ipv6=off valid=10s;
    # Penjelasan: Membatasi waktu resolusi nama upstream menjadi 5 detik agar kegagalan DNS tidak menahan request tanpa batas. Deklarasi: resolver_timeout 5s;
    resolver_timeout 5s;
    # Penjelasan: Menyimpan URL upstream API/UI dalam variabel; proxy_pass memakainya untuk menghubungi layanan yang sesuai. Deklarasi: set $api_upstream http://api:5041;
    set $api_upstream http://api:5041;
    # Penjelasan: Menyimpan URL upstream API/UI dalam variabel; proxy_pass memakainya untuk menghubungi layanan yang sesuai. Deklarasi: set $ui_upstream http://ui:5203;
    set $ui_upstream http://ui:5203;

    # Penjelasan: Mengarahkan penanganan status 503 ke named location maintenance untuk menyajikan halaman pemeliharaan. Deklarasi: error_page 503 @maintenance;
    error_page 503 @maintenance;
    # Penjelasan: Memeriksa keberadaan flag maintenance pada filesystem mount; jika ada, server menghasilkan status 503 sebelum meneruskan request aplikasi. Deklarasi: if (-f /var/www/maintenance/enabled) {
    if (-f /var/www/maintenance/enabled) {
        # Penjelasan: Menghasilkan status HTTP yang ditentukan dan menghentikan pemrosesan lokasi, misalnya 503 untuk maintenance atau 404 untuk metrik publik. Deklarasi: return 503;
        return 503;
    # Penjelasan: Menutup blok map, server, location, atau cabang; direktif sesudahnya kembali pada konteks konfigurasi induk. Deklarasi: }
    }

    # Penjelasan: Memulai aturan pencocokan URI. = adalah kecocokan persis, ^~ memprioritaskan prefiks terhadap regex, ~/~* memakai regex, @ adalah named location, dan / menjadi prefiks fallback. Deklarasi: location @maintenance {
    location @maintenance {
        # Penjelasan: Memilih folder asal dokumen statis halaman pemeliharaan dari mount baca-saja. Deklarasi: root /var/www/maintenance;
        root /var/www/maintenance;
        # Penjelasan: Mengubah URI menjadi /maintenance.html di lokasi pemeliharaan; break menghentikan rangkaian rewrite pada lokasi ini. Deklarasi: rewrite ^ /maintenance.html break;
        rewrite ^ /maintenance.html break;
        # Penjelasan: Menambahkan header respons sesuai nama dan nilai yang dinyatakan. always, bila ada, membuat header berlaku juga pada respons error yang tidak dicakup perilaku default. Deklarasi: add_header Cache-Control "no-store" always;
        add_header Cache-Control "no-store" always;
    # Penjelasan: Menutup blok map, server, location, atau cabang; direktif sesudahnya kembali pada konteks konfigurasi induk. Deklarasi: }
    }

    # Security headers
    # Penjelasan: Menambahkan header respons sesuai nama dan nilai yang dinyatakan. always, bila ada, membuat header berlaku juga pada respons error yang tidak dicakup perilaku default. Deklarasi: add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Penjelasan: Menambahkan header respons sesuai nama dan nilai yang dinyatakan. always, bila ada, membuat header berlaku juga pada respons error yang tidak dicakup perilaku default. Deklarasi: add_header X-Content-Type-Options "nosniff" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Penjelasan: Menambahkan header respons sesuai nama dan nilai yang dinyatakan. always, bila ada, membuat header berlaku juga pada respons error yang tidak dicakup perilaku default. Deklarasi: add_header X-XSS-Protection "1; mode=block" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Penjelasan: Menambahkan header respons sesuai nama dan nilai yang dinyatakan. always, bila ada, membuat header berlaku juga pada respons error yang tidak dicakup perilaku default. Deklarasi: add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    # Penjelasan: Mengaktifkan kompresi gzip bagi respons yang memenuhi tipe dan batas panjang berikutnya. Deklarasi: gzip on;
    gzip on;
    # Penjelasan: Mendaftar MIME type yang boleh dikompresi, meliputi teks, CSS, JSON, JavaScript, XML, dan SVG. Deklarasi: gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    # Penjelasan: Menetapkan panjang minimum respons 1000 byte agar respons kecil tidak diberi overhead kompresi. Deklarasi: gzip_min_length 1000;
    gzip_min_length 1000;
    # Penjelasan: Menambahkan Vary: Accept-Encoding agar cache membedakan respons terkompresi dan tidak terkompresi. Deklarasi: gzip_vary on;
    gzip_vary on;

    # ---- Health check endpoint (untuk Docker healthcheck) ----
    # Penjelasan: Memulai aturan pencocokan URI. = adalah kecocokan persis, ^~ memprioritaskan prefiks terhadap regex, ~/~* memakai regex, @ adalah named location, dan / menjadi prefiks fallback. Deklarasi: location = /health {
    location = /health {
        # Penjelasan: Menonaktifkan log akses pada endpoint/aset lokasi ini untuk mengurangi entri berulang yang tidak dibutuhkan. Deklarasi: access_log off;
        access_log off;
        # Penjelasan: Meneruskan request ke upstream yang disebut; path tambahan / atau /health/ready menentukan URI origin yang dipakai pada lokasi ini. Deklarasi: proxy_pass $ui_upstream/health/ready;
        proxy_pass $ui_upstream/health/ready;
        # Penjelasan: Menggunakan HTTP/1.1 pada koneksi Nginx ke layanan origin ASP.NET Core. Deklarasi: proxy_http_version 1.1;
        proxy_http_version 1.1;
        # Penjelasan: Menetapkan header request upstream untuk membawa Host, alamat klien, skema publik, atau identitas request. Variabel sumber mengikuti nilai pada deklarasi ini. Deklarasi: proxy_set_header Host ui;
        proxy_set_header Host ui;
        # Penjelasan: Menetapkan header request upstream untuk membawa Host, alamat klien, skema publik, atau identitas request. Variabel sumber mengikuti nilai pada deklarasi ini. Deklarasi: proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Proto https;
    # Penjelasan: Menutup blok map, server, location, atau cabang; direktif sesudahnya kembali pada konteks konfigurasi induk. Deklarasi: }
    }

    # Metrics hanya tersedia di jaringan internal container.
    # Penjelasan: Memulai aturan pencocokan URI. = adalah kecocokan persis, ^~ memprioritaskan prefiks terhadap regex, ~/~* memakai regex, @ adalah named location, dan / menjadi prefiks fallback. Deklarasi: location = /metrics {
    location = /metrics {
        # Penjelasan: Menonaktifkan log akses pada endpoint/aset lokasi ini untuk mengurangi entri berulang yang tidak dibutuhkan. Deklarasi: access_log off;
        access_log off;
        # Penjelasan: Menghasilkan status HTTP yang ditentukan dan menghentikan pemrosesan lokasi, misalnya 503 untuk maintenance atau 404 untuk metrik publik. Deklarasi: return 404;
        return 404;
    # Penjelasan: Menutup blok map, server, location, atau cabang; direktif sesudahnya kembali pada konteks konfigurasi induk. Deklarasi: }
    }

    # ---- API routes ---- 
    # Penjelasan: Memulai aturan pencocokan URI. = adalah kecocokan persis, ^~ memprioritaskan prefiks terhadap regex, ~/~* memakai regex, @ adalah named location, dan / menjadi prefiks fallback. Deklarasi: location /api/ {
    location /api/ {
        # Penjelasan: Menerapkan zona rate limit dengan kapasitas burst yang ditentukan; nodelay tidak menunda request burst yang masih diizinkan. Deklarasi: limit_req zone=api_limit burst=20 nodelay;
        limit_req zone=api_limit burst=20 nodelay;

        # Penjelasan: Meneruskan request ke upstream yang disebut; path tambahan / atau /health/ready menentukan URI origin yang dipakai pada lokasi ini. Deklarasi: proxy_pass $api_upstream;
        proxy_pass $api_upstream;
        # Penjelasan: Menggunakan HTTP/1.1 pada koneksi Nginx ke layanan origin ASP.NET Core. Deklarasi: proxy_http_version 1.1;
        proxy_http_version 1.1;
        # Penjelasan: Menetapkan header request upstream untuk membawa Host, alamat klien, skema publik, atau identitas request. Variabel sumber mengikuti nilai pada deklarasi ini. Deklarasi: proxy_set_header Host $host;
        proxy_set_header Host $host;
        # Penjelasan: Menetapkan header request upstream untuk membawa Host, alamat klien, skema publik, atau identitas request. Variabel sumber mengikuti nilai pada deklarasi ini. Deklarasi: proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Penjelasan: Menetapkan header request upstream untuk membawa Host, alamat klien, skema publik, atau identitas request. Variabel sumber mengikuti nilai pada deklarasi ini. Deklarasi: proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Penjelasan: Menetapkan header request upstream untuk membawa Host, alamat klien, skema publik, atau identitas request. Variabel sumber mengikuti nilai pada deklarasi ini. Deklarasi: proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        # Penjelasan: Menetapkan header request upstream untuk membawa Host, alamat klien, skema publik, atau identitas request. Variabel sumber mengikuti nilai pada deklarasi ini. Deklarasi: proxy_set_header X-Client-Request-Id $request_id;
        proxy_set_header X-Client-Request-Id $request_id;

        # Timeout
        # Penjelasan: Membatasi waktu pembentukan koneksi ke upstream menjadi 10 detik. Deklarasi: proxy_connect_timeout 10s;
        proxy_connect_timeout 10s;
        # Penjelasan: Membatasi waktu tunggu antarpembacaan respons upstream menjadi 30 detik. Deklarasi: proxy_read_timeout 30s;
        proxy_read_timeout 30s;
        # Penjelasan: Membatasi waktu tunggu antarpengiriman data ke upstream menjadi 30 detik. Deklarasi: proxy_send_timeout 30s;
        proxy_send_timeout 30s;

        # Buffer
        # Penjelasan: Mengaktifkan penampungan respons upstream dalam buffer Nginx sebelum/selama pengiriman ke klien. Deklarasi: proxy_buffering on;
        proxy_buffering on;
        # Penjelasan: Menetapkan ukuran buffer bagian awal respons upstream, termasuk header, sebesar 8 KiB. Deklarasi: proxy_buffer_size 8k;
        proxy_buffer_size 8k;
        # Penjelasan: Menyediakan delapan buffer masing-masing 8 KiB untuk membaca respons upstream pada lokasi API. Deklarasi: proxy_buffers 8 8k;
        proxy_buffers 8 8k;
    # Penjelasan: Menutup blok map, server, location, atau cabang; direktif sesudahnya kembali pada konteks konfigurasi induk. Deklarasi: }
    }

