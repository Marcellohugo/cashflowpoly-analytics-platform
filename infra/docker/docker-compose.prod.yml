# Fungsi file: Mendefinisikan override konfigurasi produksi untuk orkestrasi layanan kontainer.
# docker-compose.prod.yml
# Production deployment dengan Nginx reverse proxy
#
# Penggunaan:
#   docker compose --env-file config/env/.env.prod -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.prod.yml --profile tunnel up -d --build db api ui nginx cloudflared
#
# File ini meng-override docker-compose.yml untuk production:
# - Memakai build lokal dari source untuk API dan UI
# - Menambah Nginx sebagai reverse proxy HTTP internal; HTTPS diterminasi Cloudflare Tunnel
# - Environment diset Production
# - Port internal API & UI tidak di-expose langsung

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-cashflowpoly};Username=${POSTGRES_USER:-cashflowpoly};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi untuk production}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY wajib diisi untuk production}
      AllowedHosts: api;localhost;${DOMAIN:?DOMAIN wajib diisi untuk production}
      Networking__TrustedNetworks__0: 172.16.0.0/12
    ports: !override []
    security_opt:
      - no-new-privileges:true
    logging:
      driver: ${LOG_DRIVER:-journald}
      options:
        tag: cashflowpoly-api
    # Hapus port mapping langsung, semua traffic lewat Nginx

  ui:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ui;localhost;${DOMAIN:?DOMAIN wajib diisi untuk production}
      DOMAIN: ${DOMAIN:?DOMAIN wajib diisi untuk production}
      Networking__TrustedNetworks__0: 172.16.0.0/12
      Security__RequireHttps: "true"
    ports: !override []
    security_opt:
      - no-new-privileges:true
    logging:
      driver: ${LOG_DRIVER:-journald}
      options:
        tag: cashflowpoly-ui

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi untuk production}
    ports: !override []
    logging:
      driver: ${LOG_DRIVER:-journald}
      options:
        tag: cashflowpoly-db
    # Database tidak di-expose ke luar di production

  nginx:
    image: nginxinc/nginx-unprivileged:1.31.3-alpine
    container_name: cashflowpoly-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:8080"
    volumes:
      - ../../infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../infra/nginx/maintenance:/var/www/maintenance:ro
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - cashflowpoly-net
    # Allow the non-root nginx process to bind the internal privileged port
    # required by the existing Cloudflare Tunnel ingress configuration.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: ${LOG_DRIVER:-journald}
      options:
        tag: cashflowpoly-nginx

  # Cloudflare Named Tunnel menyediakan terminasi HTTPS untuk template production ini.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.1
    container_name: cashflowpoly-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --protocol http2 run --url http://nginx:8080 --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_LOGLEVEL=info
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - cashflowpoly-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cloudflared", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: ${LOG_DRIVER:-journald}
      options:
        tag: cashflowpoly-tunnel
